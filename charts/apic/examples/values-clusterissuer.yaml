# Deployment wave control
# IMPORTANT: Set this parameter when deploying with Helm
# Valid values: "1" (operators), "2" (certificates), "3" (subsystems), "4" (post-config, optional), "all" (ArgoCD)
#
# Example commands:
#   helm install apic-operators . -f values-localissuer.yaml --set deployment.wave=1 -n apic
#   helm install apic-certificates . -f values-localissuer.yaml --set deployment.wave=2 -n apic
#   helm install apic-subsystems . -f values-localissuer.yaml --set deployment.wave=3 -n apic
#   helm install apic-postconfig . -f values-localissuer.yaml --set deployment.wave=4 -n apic
#
# deployment:
#   wave: ""  # Set via --set deployment.wave=X on command line

subscriptions:
  apiconnect:
    channel: v8.0
  commonServices:
    channel: v4.19

global:
  namespace: apic
  imagePullSecret: ibm-entitlement-key
  imageRegistry: cp.icr.io/cp/apic
  # Prefiexing the stackHost with the namespace to avoid conflicts with the clusterissuer deployment which shares the same host value but is deployed in a different namespace.
  stackHost: apic.apps.itz-l9qxlg.infra01-lb.lon04.techzone.ibm.com # Replace with your cluster's host
  storageClass: ocs-external-storagecluster-ceph-rbd
  appProductVersion: "12.1.1.0"
  license:
    accept: true
    use: nonproduction
    id: L-CXFF-XRSP3J
    metric: MONTHLY_API_CALL

certificates:
  enabled: true
  issuer:
    mode: existing
    name: "custom-cluster-issuer"
    kind: ClusterIssuer

management:
  enabled: true
  profile: n1xc2.m16

analytics:
  enabled: true
  profile: n1xc2.m16
  storageType: shared
  dataVolumeSize: 100Gi
  federatedAPIManagementMode: true
  devPortalMode: true

devportal:
  enabled: true
  profile: n1xc2.m4
  analyticsRef:
    name: analytics
    namespace: apic

wmapigateway:
  enabled: true
  profile: n1xc3.m6
  dataVolumeSize: 10Gi
  encryptionSecret:
    enabled: true
    secretName: wmapigateway-enc-key

valkey:
  enabled: true

nanogateway:
  enabled: true
  profile: n1xc2.m4
  imageRegistry: cp.icr.io/cp/apic
  redis:
    # leave empty to use the in-chart Valkey deployment (set valkey.enabled: true above)
    host: ""
    port: 6379
    mode: cluster
    credentialSecret: valkey-secret
    tlsSecret: valkey-tls

federatedapimanagement:
  enabled: true
  profile: n1xc3.m4
  analyticsRef:
    name: analytics
    namespace: apic

postConfig:
  enabled: true
  # Built from ansible/Dockerfile and pushed to the apic-postconfig
  # ImageStream in this namespace (internal registry service reference).
  image: image-registry.openshift-image-registry.svc:5000/apic/apic-postconfig:1.0.0
  # REQUIRED: connected to Cloud Manager before the provider org is created.
  # Values below match the MailPit instance from the README prerequisites;
  # change host/port if pointing at a different SMTP server.
  # We use here a Mailpit instance deployed within the same cluster
  mailServer:
    name: mailpit-server
    title: "Mail Pit Server"
    host: mailpit-smtp.mailpit.svc.cluster.local
    port: 1025
  # The provider org and the admin user that owns it (created for you in the
  # api-manager-lur registry, not an existing user).
  providerOrg:
    name: apic-demo-org
    title: "APIC demo Provider Org"
    admin:
      # REQUIRED: replace with real values before running wave 4.
      username: "porgadmin"
      email: "porgadmin@apic.com"
      firstName: "porg"
      lastName: "admin"


