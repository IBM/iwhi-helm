# Note: this CA is provided for testing purposes only, and should not be used for production deployments
#
# Unlike a namespaced Issuer, a ClusterIssuer's `spec.ca.secretName` is resolved
# in cert-manager's cluster resource namespace (the `cert-manager` namespace by
# default, or whatever --cluster-resource-namespace the controller was started
# with) — NOT in the namespace where you deploy this chart. Adjust the
# Secret's `metadata.namespace` below if your cluster uses a different one.

apiVersion: v1
kind: Secret
metadata:
  name: custom-ca
  namespace: cert-manager
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
  ca.crt: 

---

apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: custom-cluster-issuer
spec:
  ca:
    secretName: custom-ca
