# Note: this CA is provided for testing purposes only, and should not be used for production deployments

apiVersion: v1
kind: Secret
metadata:
  name: custom-ca
  labels:
    app.kubernetes.io/instance: "management"
    app.kubernetes.io/managed-by: "ibm-apiconnect"
    app.kubernetes.io/name: "custom-ca"
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 
  ca.crt: 

---

apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: custom-issuer
  labels: {
    app.kubernetes.io/instance: "management",
    app.kubernetes.io/managed-by: "ibm-apiconnect",
    app.kubernetes.io/name: "custom-issuer"
  }
spec:
  ca:
    secretName: custom-ca
