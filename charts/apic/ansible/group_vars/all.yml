# =============================================================================
# Common variables for API Connect post-configuration playbooks.
# Instance names here must match the release names used by the apic Helm
# chart (charts/apic/templates/*-cr.yaml), not the cp4i-demo script defaults.
# =============================================================================

apic_namespace: apic

apic_mgmt_instance: management
apic_analytics_instance: analytics
apic_wmapigateway_instance: wmapigateway
apic_nanogateway_instance: ngw
apic_wmdevportal_instance: devportal
apic_fam_instance: fam

apic_realm: admin/default-idp-1
apic_admin_user: admin
# apic_admin_password: set via -e or vault; falls back to reading
# <apic_mgmt_instance>-admin-secret from the cluster when undefined.

# apic_mailserver_name / .title / apic_mail_host / .port: no default — always
# passed as extra-vars by postconfig-job.yaml from postConfig.mailServer.*.
# apic_initial_config asserts they're all set; there is no fallback mail
# server (see charts/apic/README.md Prerequisites for SMTP options).

# Provider org + first user, created by role apic_porg_lur.
apic_porg_name: user-demo-org
apic_porg_title: "USER Demo Provider Org"
apic_porg_user_id: ""
apic_porg_user_email: ""
apic_porg_user_fname: ""
apic_porg_user_lname: ""

# Secret used to persist provider-org/user state across role runs, mirroring
# the cp4i-demo scripts' porg-lur-users-info secret.
apic_state_secret_name: porg-lur-users-info

# FAM control-plane account credentials: read from the fam-admin-secret
# Kubernetes secret by role apic_fam_config (see its defaults/main.yml for
# the secret/key names), auto-generated by the apic Helm chart in wave 2.
# No apic_fam_admin_user/apic_fam_admin_password variable here anymore.

apic_validate_certs: false
