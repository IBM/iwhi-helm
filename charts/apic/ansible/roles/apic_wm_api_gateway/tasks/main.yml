---
# Equivalent of cp4i-demo scripts/87o-apic-wm-api-gateway-config.sh:
#   - add the wM API Gateway to the Cloud Manager topology, if absent.

- name: "Log in as admin"
  ansible.builtin.include_role:
    name: apic_common
    tasks_from: admin_login.yml

- name: "List existing gateway services"
  ansible.builtin.uri:
    url: "{{ apic_server_url }}/api/orgs/admin/availability-zones/availability-zone-default/gateway-services"
    method: GET
    validate_certs: "{{ apic_validate_certs }}"
    headers: "{{ apic_auth_headers }}"
    status_code: [200]
  register: _apic_gateway_services

- name: "Set gateway service URL fact from existing definition"
  ansible.builtin.set_fact:
    _apic_svc_url: >-
      {{ (_apic_gateway_services.json.results
          | selectattr('name', 'equalto', 'wm-gateway-service')
          | map(attribute='url') | first) | default('', true) }}

- name: "Create wM API Gateway service block"
  when: _apic_svc_url | length == 0
  block:
    - name: "List integration gateway services"
      ansible.builtin.uri:
        url: "{{ apic_server_url }}/api/cloud/integrations/gateway-service"
        method: GET
        validate_certs: "{{ apic_validate_certs }}"
        headers: "{{ apic_auth_headers }}"
        status_code: [200]
      register: _apic_integrations

    - name: "Set integration service URL fact"
      ansible.builtin.set_fact:
        _apic_int_url: >-
          {{ (_apic_integrations.json.results
              | selectattr('name', 'equalto', 'wm-api-gateway')
              | map(attribute='url') | first) | default('', true) }}

    - name: "Fail if the wM API Gateway integration service is missing"
      ansible.builtin.fail:
        msg: >-
          wM API Gateway integration service is not available in this API
          Connect stack. Check the WMAPIGatewayCluster is Ready and try again.
      when: _apic_int_url | length == 0

    - name: "List TLS client profiles"
      ansible.builtin.uri:
        url: "{{ apic_server_url }}/api/orgs/admin/tls-client-profiles"
        method: GET
        validate_certs: "{{ apic_validate_certs }}"
        headers: "{{ apic_auth_headers }}"
        status_code: [200]
      register: _apic_tls_client_profiles

    - name: "Set TLS client profile URL fact"
      ansible.builtin.set_fact:
        _apic_svc_tls_cpro_url: >-
          {{ (_apic_tls_client_profiles.json.results
              | selectattr('name', 'equalto', 'wmapigateway-mgmt-client-default')
              | map(attribute='url') | first) | default('', true) }}

    - name: "Fail if the wM API Gateway TLS client profile is missing"
      ansible.builtin.fail:
        msg: >-
          wM API Gateway TLS Client Profile 'wmapigateway-mgmt-client-default'
          is not available in this API Connect stack.
      when: _apic_svc_tls_cpro_url | length == 0

    - name: "List TLS server profiles"
      ansible.builtin.uri:
        url: "{{ apic_server_url }}/api/orgs/admin/tls-server-profiles"
        method: GET
        validate_certs: "{{ apic_validate_certs }}"
        headers: "{{ apic_auth_headers }}"
        status_code: [200]
      register: _apic_tls_server_profiles

    - name: "Set TLS server profile URL fact"
      ansible.builtin.set_fact:
        _apic_svc_tls_spro_url: >-
          {{ (_apic_tls_server_profiles.json.results
              | selectattr('name', 'equalto', 'tls-server-profile-default')
              | map(attribute='url') | first) | default('', true) }}

    - name: "Fail if the wM API Gateway TLS server profile is missing"
      ansible.builtin.fail:
        msg: >-
          wM API Gateway TLS Server Profile 'tls-server-profile-default' is
          not available in this API Connect stack.
      when: _apic_svc_tls_spro_url | length == 0

    - name: "List analytics services"
      ansible.builtin.uri:
        url: "{{ apic_server_url }}/api/orgs/admin/availability-zones/availability-zone-default/analytics-services"
        method: GET
        validate_certs: "{{ apic_validate_certs }}"
        headers: "{{ apic_auth_headers }}"
        status_code: [200]
      register: _apic_analytics_services

    - name: "Set analytics service URL fact (optional)"
      ansible.builtin.set_fact:
        _apic_a7s_url: >-
          {{ (_apic_analytics_services.json.results
              | selectattr('name', 'equalto', 'analytics-service')
              | map(attribute='url') | first) | default('', true) }}

    - name: "Look up wM API Gateway mgmt and gateway routes"
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: "{{ item }}"
        namespace: "{{ apic_namespace }}"
      loop:
        - "{{ apic_wmapigateway_instance }}-mgmt-endpoint"
        - "{{ apic_wmapigateway_instance }}-gateway-endpoint"
      register: _apic_wmapigw_routes

    - name: "Set gateway endpoint URL facts"
      ansible.builtin.set_fact:
        _apic_gw_mgmt_url: "https://{{ _apic_wmapigw_routes.results[0].resources[0].spec.host }}"
        _apic_gw_url: "https://{{ _apic_wmapigw_routes.results[1].resources[0].spec.host }}"

    - name: "Build the gateway service definition body"
      # ai_gateway_enabled is NOT sent here: the API rejects it for any
      # gateway_service_type other than 'datapower-api-gateway' (confirmed
      # by a 400 "ai_gateway_enabled property cannot be set..." error). The
      # cp4i-demo reference script always strips this field for wm-api-gateway
      # and datapower-nano-gateway alike; only analytics_service_url is
      # conditional on analytics being deployed.
      ansible.builtin.set_fact:
        _apic_gtwy_svc_body: >-
          {{
            {
              'type': 'gateway_service',
              'gateway_service_type': 'wm-api-gateway',
              'api_version': '2.0.0',
              'name': 'wm-gateway-service',
              'title': 'wm-gateway-service',
              'runtime_name': 'wm-gateway-service',
              'runtime_id': 'wm-gateway-service-000',
              'integration_url': _apic_int_url,
              'endpoint': _apic_gw_mgmt_url,
              'api_endpoint_base': _apic_gw_url,
              'tls_client_profile_url': _apic_svc_tls_cpro_url,
              'sni': [{'host': '*', 'tls_server_profile_url': _apic_svc_tls_spro_url}],
              'communication_kind': 'external',
              'communication_to_analytics_kind': 'external',
              'communication_to_analytics_with_jwt': false,
            }
            | combine({'analytics_service_url': _apic_a7s_url} if _apic_a7s_url | length > 0 else {})
          }}

    - name: "Create the wM API Gateway service"
      ansible.builtin.uri:
        url: "{{ apic_server_url }}/api/orgs/admin/availability-zones/availability-zone-default/gateway-services"
        method: POST
        validate_certs: "{{ apic_validate_certs }}"
        headers: "{{ apic_auth_headers_json }}"
        body_format: json
        body: "{{ _apic_gtwy_svc_body }}"
        status_code: [201]

- name: "Existing gateway service notice"
  ansible.builtin.debug:
    msg: "Gateway service wm-gateway-service already exists."
  when: _apic_svc_url | length > 0
