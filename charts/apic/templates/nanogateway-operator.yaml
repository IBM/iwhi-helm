{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.nanogateway.enabled (or (eq $wave "1") (eq $wave "all")) }}
# =============================================================================
# Wave 1 – Nano Gateway Operator (RBAC + Deployment)
# Distinct from the ibm-apiconnect operator (Subscription in subscriptions.yaml).
# Requires the CRDs in crds/nanogateway-crds.yaml, installed by Helm once and
# not updated on upgrade.
# =============================================================================

{{- if not .Values.nanogateway.skipGatewayApiCheck }}
{{- if not (.Capabilities.APIVersions.Has "gateway.networking.k8s.io/v1") }}
{{- fail "\n\n❌ ERROR: Gateway API is not available in the target cluster!\n\nThe Nano Gateway operator requires the Gateway API CRDs (gateway.networking.k8s.io/v1).\nThese ship by default on OpenShift >= 4.19 (Gateway API reached GA in 4.19).\nOn older clusters, install them manually first:\n\n  oc apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml\n\nIf you are rendering this chart without a live cluster connection (helm template,\nhelm install --dry-run=client, CI), this check cannot see the cluster's installed\nAPIs and will always fail. Skip it explicitly with:\n\n  --set nanogateway.skipGatewayApiCheck=true\n" }}
{{- end }}
{{- end }}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: datapower-nano-operator
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: datapower-nano-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
rules:
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses
  - gateways
  - httproutes
  verbs:
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - gateway.networking.k8s.io
  resources:
  - gatewayclasses/status
  - gateways/status
  - httproutes/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - nano.datapower.ibm.com
  resources:
  - apis
  - apisets
  - assemblies
  - autoscaleconfigs
  - jwtproviders
  - managements
  - mcptools
  - oauthproviders
  - runtimeconfigs
  - runtimes
  - tlsclientprofiles
  - tlsserverprofiles
  - userdefinedpolicies
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - nano.datapower.ibm.com
  resources:
  - apis/status
  - apisets/status
  - assemblies/status
  - autoscaleconfigs/status
  - jwtproviders/status
  - managements/scale
  - managements/status
  - mcptools/status
  - oauthproviders/status
  - runtimeconfigs/status
  - runtimes/scale
  - runtimes/status
  - tlsclientprofiles/status
  - tlsserverprofiles/status
  - userdefinedpolicies/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - configmaps
  - services
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - get
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - rbac.authorization.k8s.io
  resources:
  - roles
  - rolebindings
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: datapower-nano-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: datapower-nano-operator
subjects:
- kind: ServiceAccount
  name: datapower-nano-operator
  namespace: {{ include "apic.namespace" . }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: datapower-nano-operator
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: datapower-nano-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: datapower-nano-operator
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - amd64
      containers:
      - name: datapower-nano-operator
        image: {{ .Values.nanogateway.operatorImage }}
        imagePullPolicy: Always
        env:
        - name: RUST_LOG
          value: dpn_operator=info
        - name: RUST_BACKTRACE
          value: "1"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        resources:
          {{- toYaml .Values.nanogateway.operatorResources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: false
      hostIPC: false
      hostNetwork: false
      hostPID: false
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      securityContext:
        runAsNonRoot: true
      serviceAccountName: datapower-nano-operator
      terminationGracePeriodSeconds: 10
      topologySpreadConstraints:
      - labelSelector:
          matchLabels:
            app.kubernetes.io/name: datapower-nano-operator
        maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: ScheduleAnyway
{{- end }}
