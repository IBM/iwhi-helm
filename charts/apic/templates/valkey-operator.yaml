{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.valkey.enabled (or (eq $wave "1") (eq $wave "all")) }}
# =============================================================================
# Wave 1 – Valkey Operator (RBAC + Deployment)
# Required by the Nano Gateway subsystem's key-value store.
# =============================================================================

---
apiVersion: v1
kind: ServiceAccount
automountServiceAccountToken: true
metadata:
  name: valkey-operator
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: valkey-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
rules:
- apiGroups:
  - valkey.datapower.ibm.com
  resources:
  - valkeys
  - valkeyclusters
  - valkeyreplications
  - valkey
  - valkeycluster
  - valkeysentinel
  - valkeysentinels
  - valkeyreplication
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- nonResourceURLs:
  - '*'
  verbs:
  - get
- apiGroups:
  - apiextensions.k8s.io
  resources:
  - customresourcedefinitions
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - valkey.datapower.ibm.com
  resources:
  - valkey/status
  - valkeycluster/status
  - valkeyclusters/status
  - valkeysentinel/status
  - valkeysentinels/status
  - valkeyreplication/status
  - valkeyreplications/status
  verbs:
  - get
  - patch
  - update
- apiGroups:
  - ""
  resources:
  - secrets
  - pods/exec
  - pods
  - services
  - configmaps
  - events
  - persistentvolumeclaims
  - namespace
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - apps
  resources:
  - statefulsets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - coordination.k8s.io
  resources:
  - leases
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - policy
  resources:
  - poddisruptionbudgets
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: valkey-operator
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
subjects:
- kind: ServiceAccount
  name: valkey-operator
  namespace: {{ include "apic.namespace" . }}
roleRef:
  kind: ClusterRole
  name: valkey-operator
  apiGroup: rbac.authorization.k8s.io

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-operator
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: valkey-operator
  template:
    metadata:
      annotations:
        cert-manager.io/inject-ca-from: default/serving-cert
      labels:
        name: valkey-operator
    spec:
      automountServiceAccountToken: true
      imagePullSecrets:
      - name: {{ .Values.global.imagePullSecret }}
      securityContext: {}
      serviceAccountName: valkey-operator
      serviceAccount: valkey-operator
      containers:
      - name: valkey-operator
        securityContext: {}
        image: {{ .Values.valkey.operatorImage }}
        imagePullPolicy: Always
        command:
        - /operator
        - manager
        args:
        - --leader-elect
        - --metrics-bind-address=:8080
        - --kube-client-timeout=60s
        ports:
        - containerPort: 8081
          name: probe
          protocol: TCP
        - containerPort: 8080
          name: metrics
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /healthz
            port: probe
        readinessProbe:
          httpGet:
            path: /readyz
            port: probe
        env:
        - name: OPERATOR_IMAGE
          value: {{ .Values.valkey.operatorImage }}
        - name: ENABLE_WEBHOOKS
          value: "false"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: FEATURE_GATES
          value: "GenerateConfigInInitContainer=true"
        resources:
          {{- toYaml .Values.valkey.operatorResources | nindent 10 }}
{{- end }}
