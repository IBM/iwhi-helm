{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.valkey.enabled .Values.valkey.credentialSecret.autoGenerate (or (eq $wave "2") (eq $wave "all")) }}
# =============================================================================
# Wave 2 – Valkey credential secret
# Auto-generated once; the existing password is reused on subsequent upgrades
# via `lookup` so the ValkeyCluster CR (wave 3) is never re-created with a
# mismatched password. Includes both username and password keys: the Nano
# Gateway management component mounts this secret at /opt/ibm/dpn/creds/db
# and expects both files to be present, even though the ValkeyCluster CR
# itself only references the password key.
# =============================================================================
{{- $ns := include "apic.namespace" . }}
{{- $secretName := .Values.valkey.credentialSecret.name }}
{{- $secretKey := .Values.valkey.credentialSecret.key }}
{{- $usernameKey := .Values.valkey.credentialSecret.usernameKey }}
{{- $existing := lookup "v1" "Secret" $ns $secretName }}
{{- $password := "" }}
{{- if $existing }}
{{- $password = index $existing.data $secretKey | b64dec }}
{{- else }}
{{- $password = randAlphaNum 16 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
type: Opaque
data:
  {{ $secretKey }}: {{ $password | b64enc }}
  {{ $usernameKey }}: {{ .Values.valkey.credentialSecret.username | b64enc }}
{{- end }}
