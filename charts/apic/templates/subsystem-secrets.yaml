{{- $wave := .Values.deployment.wave | toString }}
{{- if or (eq $wave "2") (eq $wave "all") }}
# =============================================================================
# Wave 2 – Auto-generated subsystem secrets
# Each secret is auto-generated once; the existing value is reused on
# subsequent upgrades via `lookup`. Set the corresponding *.autoGenerate to
# false to manage them externally.
#
# wmapigateway-admin-secret is NOT managed by this chart at all, in any wave.
# The ibm-apiconnect operator creates/owns it itself when the
# WMAPIGatewayCluster CR (wave 3) is submitted — confirmed via managedFields
# history (the operator's field-manager takes over labels/password shortly
# after the CR reconciles). Managing it with Helm at any point causes a
# permanent field-manager conflict on subsequent `helm upgrade` runs.
#
# fam-admin-secret has no such constraint (it's read directly by the wave 4
# apic_fam_config Ansible role via the Kubernetes API, not referenced by any
# CR, and no operator adopts it), so it's safe to generate here.
# =============================================================================

{{- if and .Values.management.enabled .Values.management.adminSecret.autoGenerate }}
{{- include "apic.autoGeneratedSecret" (dict "root" . "name" .Values.management.adminSecret.name "key" .Values.management.adminSecret.key) }}
{{- end }}

{{- if and .Values.wmapigateway.enabled .Values.wmapigateway.encryptionSecret.enabled .Values.wmapigateway.encryptionSecret.autoGenerate }}
{{- include "apic.autoGeneratedSecret" (dict "root" . "name" .Values.wmapigateway.encryptionSecret.secretName "key" "password") }}
{{- end }}

{{- if and .Values.federatedapimanagement.enabled .Values.federatedapimanagement.adminSecret.autoGenerate }}
{{- $famSecretName := .Values.federatedapimanagement.adminSecret.name }}
{{- $famSecretKey := .Values.federatedapimanagement.adminSecret.key }}
{{- $famExisting := lookup "v1" "Secret" (include "apic.namespace" .) $famSecretName }}
{{- $famPassword := "" }}
{{- if $famExisting }}
{{- $famPassword = index $famExisting.data $famSecretKey | b64dec }}
{{- else }}
{{- $famPassword = randAlphaNum 16 }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $famSecretName }}
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
type: Opaque
data:
  username: {{ .Values.federatedapimanagement.adminSecret.username | b64enc }}
  {{ $famSecretKey }}: {{ $famPassword | b64enc }}
{{- end }}

{{- end }}
