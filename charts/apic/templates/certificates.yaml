{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.certificates.enabled (or (eq $wave "2") (eq $wave "all")) }}

# =============================================================================
# Wave 2 – cert-manager Issuers and Certificates
#
# This template creates:
#   1. selfsigning-issuer – Used by subsystem operators (and Valkey, below)
#      to create their own CAs
#   2. Leaf certificates for internal mTLS between subsystems, signed by
#      certificates.issuer (see values.yaml) — the SAME issuer used for the
#      public ingress endpoints of each CR (see the CR templates for the
#      ingress annotation side), so a single CA is used everywhere.
#
# All resources carry sync-wave "2" so ArgoCD applies them only after the
# operator group and subscriptions (wave 1) are healthy.
# =============================================================================

---
# Self-signing root issuer - always created, used by subsystem operators to create their own CA issuers for internal traffic
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: selfsigning-issuer
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/instance: "management"
    app.kubernetes.io/managed-by: "ibm-apiconnect"
    app.kubernetes.io/name: "selfsigning-issuer"
    {{- include "apic.labels" . | nindent 4 }}
spec:
  selfSigned: {}

{{- if .Values.valkey.enabled }}
---
# =============================================================================
# Valkey TLS – dedicated CA + Issuer
#
# Valkey requires its own CA-backed issuer (distinct from certificates.issuer)
# so that the leaf certificate's SANs can cover all ValkeyCluster service names.
# Hierarchy: selfsigning-issuer -> valkey-ca -> valkey-issuer -> valkey-tls
# =============================================================================
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-ca
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  isCA: true
  commonName: ValkeyCA
  secretName: valkey-ca
  duration: 87600h   # 10 years
  renewBefore: 720h  # 30 days
  privateKey:
    rotationPolicy: Always
  issuerRef:
    name: selfsigning-issuer
    kind: Issuer

---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: valkey-issuer
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  ca:
    secretName: valkey-ca

---
{{- $ns := include "apic.namespace" . }}
{{- $svc := include "apic.valkeyClusterName" . }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: valkey-tls
  namespace: {{ $ns }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  commonName: {{ $svc }}.{{ $ns }}.svc.cluster.local
  secretName: {{ .Values.valkey.tlsSecret }}
  duration: 17520h   # 2 years
  renewBefore: 720h  # 30 days
  privateKey:
    rotationPolicy: Always
  usages:
  - digital signature
  - key encipherment
  - server auth
  - client auth
  dnsNames:
  - {{ $svc }}.{{ $ns }}.svc.cluster.local
  - {{ $svc }}.{{ $ns }}.svc
  - {{ $svc }}-headless.{{ $ns }}.svc.cluster.local
  - {{ $svc }}-headless.{{ $ns }}.svc
  - {{ $svc }}-headless
  - {{ $svc }}
  - {{ $svc }}-leader-headless.{{ $ns }}.svc.cluster.local
  - {{ $svc }}-leader-headless.{{ $ns }}.svc
  - {{ $svc }}-leader-headless
  - {{ $svc }}-leader.{{ $ns }}.svc.cluster.local
  - {{ $svc }}-leader.{{ $ns }}.svc
  - {{ $svc }}-leader
  - {{ $svc }}-follower-headless.{{ $ns }}.svc.cluster.local
  - {{ $svc }}-follower-headless.{{ $ns }}.svc
  - {{ $svc }}-follower-headless
  - {{ $svc }}-follower.{{ $ns }}.svc.cluster.local
  - {{ $svc }}-follower.{{ $ns }}.svc
  - {{ $svc }}-follower
  {{- /*
  Per-pod SANs are required because Valkey Cluster clients follow MOVED/CLUSTER
  SLOTS redirects to each pod's stable headless-service hostname; with
  tls-cluster enabled, a certificate covering only the generic service names
  fails peer verification against those per-pod hostnames.
  */}}
  {{- range $i := until (int .Values.valkey.leaderReplicas) }}
  - {{ $svc }}-leader-{{ $i }}.{{ $svc }}-leader-headless.{{ $ns }}.svc.cluster.local
  {{- end }}
  {{- range $i := until (int .Values.valkey.followerReplicas) }}
  - {{ $svc }}-follower-{{ $i }}.{{ $svc }}-follower-headless.{{ $ns }}.svc.cluster.local
  {{- end }}
  issuerRef:
    name: valkey-issuer
    kind: Issuer
{{- end }}

---
# =============================================================================
# mTLS Leaf Certificates (inter-subsystem communication)
# All certificates use the internal issuer (CA-based)
# =============================================================================

---
# Leaf certificate – portal-admin-client
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: portal-admin-client
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    app.kubernetes.io/instance: "management"
    app.kubernetes.io/managed-by: "ibm-apiconnect"
    app.kubernetes.io/name: "portal-admin-client"
    {{- include "apic.labels" . | nindent 4 }}
spec:
  subject:
    organizations:
    - cert-manager
  commonName: portal-admin-client
  secretName: portal-admin-client
  issuerRef:
    name: {{ include "apic.issuerName" . }}
    kind: {{ include "apic.issuerKind" . }}
  usages:
  - "client auth"
  - "signing"
  - "key encipherment"
  duration: 17520h # 2 years
  renewBefore: 720h # 30 days
  privateKey:
    rotationPolicy: Always
  secretTemplate:
    labels:
      app.kubernetes.io/instance: "management"
      app.kubernetes.io/managed-by: "ibm-apiconnect"
      app.kubernetes.io/name: "portal-admin-client"

