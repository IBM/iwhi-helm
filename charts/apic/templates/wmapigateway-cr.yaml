{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.wmapigateway.enabled (or (eq $wave "3") (eq $wave "all")) }}
# =============================================================================
# Wave 3 – WMAPIGatewayCluster CR
# =============================================================================
apiVersion: wmapigateway.apiconnect.ibm.com/v1beta1
kind: WMAPIGatewayCluster
metadata:
  name: wmapigateway
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    {{- include "apic.ingressIssuerAnnotation" . | nindent 4 }}
  labels:
    app.kubernetes.io/name: ibm-apiconnect
    {{- include "apic.labels" . | nindent 4 }}
spec:
  # No secretName or cert-manager.io/issuer annotation is set on any host
  # below: per the "Default issuers and automatic certificate management"
  # docs (API Connect 12.1.1+), leaving both unset lets the operator
  # auto-configure the endpoint — either against its own auto-created
  # "apic-ingress-issuer" (mode: operator) or against the issuer referenced by
  # the CR-level annotation above (mode: existing).
  gatewayEndpoint:
    hosts:
    - name: wmapigateway-gw.{{ .Values.global.stackHost }}
  uiEndpoint:
    hosts:
    - name: wmapigateway-ui.{{ .Values.global.stackHost }}
  mgmtEndpoint:
    hosts:
    - name: wmapigateway-mgmt.{{ .Values.global.stackHost }}
  mgmtClientSubjectDN: |
    CN=wmapigateway-mgmt-client,O=cert-manager
    CN=devportal-wmapigateway-client,O=cert-manager
  profile: {{ .Values.wmapigateway.profile }}
  version: {{ .Values.global.appProductVersion }}
  imagePullSecrets:
  - {{ .Values.global.imagePullSecret }}
  imageRegistry: {{ include "apic.imageRegistry" (dict "subsystem" .Values.wmapigateway "global" .Values.global) }}
  microServiceSecurity: certManager
  certManagerIssuer:
    name: "selfsigning-issuer"
    kind: "Issuer"
  {{- if .Values.wmapigateway.encryptionSecret.enabled }}
  encryptionSecret:
    secretName: {{ .Values.wmapigateway.encryptionSecret.secretName }}
  {{- end }}
  storage:
    volumeClaimTemplate:
      storageClassName: {{ include "apic.storageClass" (dict "subsystem" .Values.wmapigateway "global" .Values.global) }}
      volumeSize: {{ .Values.wmapigateway.dataVolumeSize }}
  license:
    accept: {{ .Values.global.license.accept }}
    license: {{ .Values.global.license.id | quote }}
    metric: {{ .Values.global.license.metric }}
    use: {{ .Values.global.license.use }}
  {{- $ext := .Values.wmapigateway.externalJars }}
  {{- if or .Values.wmapigateway.customImage ($ext.enabled) }}
  template:
  - name: apigateway
    containers:
    - name: apigateway
      {{- if .Values.wmapigateway.customImage }}
      image: {{ .Values.wmapigateway.customImage }}
      {{- end }}
      {{- if $ext.enabled }}
      {{- $auth := $ext.auth }}
      {{- $proxy := $ext.proxy }}
      {{- $ts := $ext.truststore }}
      # The CRD has no volumeMounts; to inject extra jars without rebuilding the
      # image we override the entrypoint. This shell preamble fetches each jar
      # from the artifact repo (fail-fast via `curl -f` + `set -e`, so a fetch
      # failure aborts startup rather than launching without the driver),
      # optionally verifies its sha256, then exec's the base image's real
      # entrypoint. Runs on every container start.
      cmd:
      - /bin/sh
      - -c
      args:
      - |
        set -e
        mkdir -p {{ $ext.targetDir }}
        {{- if $ts.enabled }}
        # Materialise the custom CA (injected via env) for curl --cacert.
        printf '%s' "$ARTIFACT_CA" > "{{ $ts.caPath }}"
        {{- end }}
        {{- range $ext.jars }}
        {{- $dest := printf "%s/%s" $ext.targetDir (base .path) }}
        curl -fsS \
          {{- if $ts.enabled }}
          --cacert "{{ $ts.caPath }}" \
          {{- end }}
          {{- if $proxy.enabled }}
          --proxy "{{ $proxy.url }}" --noproxy "{{ $proxy.noProxy }}" \
          {{- end }}
          {{- if $auth.enabled }}
          -H "{{ $auth.headerName }}: $ARTIFACT_AUTH" \
          {{- end }}
          "$ARTIFACT_REPO_BASE_URL/{{ .path }}" \
          -o "{{ $dest }}"
        {{- if .sha256 }}
        echo "{{ .sha256 }}  {{ $dest }}" | sha256sum -c -
        {{- end }}
        {{- end }}
        exec {{ $ext.imageEntrypoint }}
      env:
      - name: ARTIFACT_REPO_BASE_URL
        value: {{ $ext.repoBaseURL | quote }}
      {{- if $auth.enabled }}
      - name: ARTIFACT_AUTH
        valueFrom:
          secretKeyRef:
            name: {{ $auth.secretName }}
            key: {{ $auth.secretKey }}
      {{- end }}
      {{- if $ts.enabled }}
      - name: ARTIFACT_CA
        valueFrom:
          secretKeyRef:
            name: {{ $ts.secretName }}
            key: {{ $ts.secretKey }}
      {{- end }}
      {{- end }}
  {{- end }}
{{- end }}


