{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.federatedapimanagement.enabled (or (eq $wave "3") (eq $wave "all")) }}
# =============================================================================
# Wave 3 – FederatedAPIManagementCluster CR
# =============================================================================
apiVersion: federatedapimanagement.apiconnect.ibm.com/v1beta1
kind: FederatedAPIManagementCluster
metadata:
  name: fam
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    {{- include "apic.ingressIssuerAnnotation" . | nindent 4 }}
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  version: {{ .Values.global.appProductVersion }}
  profile: {{ .Values.federatedapimanagement.profile }}
  imagePullSecrets:
    - {{ .Values.global.imagePullSecret }}
  imageRegistry: {{ .Values.global.imageRegistry }}
  analyticsRef:
    name: {{ .Values.federatedapimanagement.analyticsRef.name }}
    namespace: {{ include "apic.analyticsRefNamespace" (dict "ref" .Values.federatedapimanagement.analyticsRef "global" .Values.global) }}
  # No secretName or cert-manager.io/issuer annotation is set below: per the
  # "Default issuers and automatic certificate management" docs (API Connect
  # 12.1.1+), leaving both unset lets the operator auto-configure the
  # endpoint — either against its own auto-created "apic-ingress-issuer"
  # (mode: operator) or against the issuer referenced by the CR-level annotation
  # above (mode: existing).
  uiEndpoint:
    hosts:
    - name: fam.{{ .Values.global.stackHost }}
  adminEndpoint:
    hosts:
    - name: api.fam.{{ .Values.global.stackHost }}
  adminClientSubjectDN: CN=federatedapimanagement-admin-client,O=cert-manager
  microServiceSecurity: certManager
  certManagerIssuer:
    name: "selfsigning-issuer"
    kind: "Issuer"
  license:
    accept: {{ .Values.global.license.accept }}
    use: {{ .Values.global.license.use }}
    license: {{ .Values.global.license.id | quote }}
{{- end }}


