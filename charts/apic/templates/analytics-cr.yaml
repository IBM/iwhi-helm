{{- $wave := .Values.deployment.wave | toString }}
{{- if and .Values.analytics.enabled (or (eq $wave "3") (eq $wave "all")) }}
# =============================================================================
# Wave 3 – AnalyticsCluster CR
# =============================================================================
apiVersion: analytics.apiconnect.ibm.com/v1beta1
kind: AnalyticsCluster
metadata:
  name: analytics
  namespace: {{ include "apic.namespace" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "apic.labels" . | nindent 4 }}
spec:
  version: {{ .Values.global.appProductVersion }}
  profile: {{ .Values.analytics.profile }}
  imagePullSecrets:
  - {{ .Values.global.imagePullSecret }}
  imageRegistry: {{ .Values.global.imageRegistry }}
  #mgmtPlatformEndpointCASecret:
  #  secretName: {{ .Values.certificates.issuer.caSecretName | default "ingress-ca" }}
  microServiceSecurity: certManager
  certManagerIssuer:
    name: selfsigning-issuer
    kind: Issuer  
  ingestion:
    endpoint:
      annotations:
        {{ if eq (.Values.certificates.issuer.kind | default "Issuer") "ClusterIssuer" }}cert-manager.io/cluster-issuer{{ else }}cert-manager.io/issuer{{ end }}: {{ .Values.certificates.issuer.name | default "ingress-issuer" }}
      hosts:
      - name: ai.{{ .Values.global.stackHost }}
        secretName: analytics-ai-endpoint
    clientSubjectDN: CN=analytics-ingestion-client,O=cert-manager
  mtlsValidateClient: true
  analyticsMode: true
  federatedAPIManagementMode: {{ .Values.analytics.federatedAPIManagementMode }}
  devPortalMode: {{ .Values.analytics.devPortalMode }}
  storage:
    type: {{ .Values.analytics.storageType }}
    shared:
      volumeClaimTemplate:
        storageClassName: {{ include "apic.storageClass" (dict "subsystem" .Values.analytics "global" .Values.global) }}
        volumeSize: {{ .Values.analytics.dataVolumeSize }}
  license:
    accept: {{ .Values.global.license.accept }}
    use: {{ .Values.global.license.use }}
    license: {{ .Values.global.license.id | quote }}
{{- end }}


