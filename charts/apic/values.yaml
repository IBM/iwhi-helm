# =============================================================================
# IBM webMethods Hybrid Integration (IWHI) – Helm Chart Values
# =============================================================================
# This file documents every configurable parameter.
# Override per environment using values-<env>.yaml (e.g. values-dev.yaml).
# =============================================================================

# -----------------------------------------------------------------------------
# Deployment control (wave-based deployment)
# -----------------------------------------------------------------------------
deployment:
  # REQUIRED: Specifies which deployment wave to execute
  # Valid values: "1", "2", "3", "all"
  # - "1": Operators only (operatorGroup + subscriptions)
  # - "2": Certificates only (requires wave 1 to be complete)
  # - "3": Subsystems only (requires wave 2 to be complete)
  # - "all": Everything with ArgoCD sync-wave annotations (GitOps mode)
  #
  # Usage examples:
  #   helm install apic-operators . -f values-dev.yaml --set deployment.wave=1
  #   helm install apic-certificates . -f values-dev.yaml --set deployment.wave=2
  #   helm install apic-subsystems . -f values-dev.yaml --set deployment.wave=3
  wave: ""  # Must be explicitly set - no default to prevent accidental full deployment

# -----------------------------------------------------------------------------
# Global / shared settings
# -----------------------------------------------------------------------------
global:
  # Target OpenShift namespace for all subsystem resources
  namespace: iwhi-dev

  # Image pull secret name (must exist in the namespace before deployment)
  imagePullSecret: ibm-entitlement-key

  # Container image registry for API Connect subsystem images
  imageRegistry: cp.icr.io/cp/apic

  # Base domain for all ingress endpoints  (e.g. apps.<cluster-domain>)
  stackHost: apps.example.com

  # Default block storage class for persistent volumes
  storageClass: ocs-external-storagecluster-ceph-rbd

  # API Connect product version (must match the operator release)
  appProductVersion: "12.1.0.1"

  # IBM License configuration
  license:
    # Set to true to accept the IBM license agreement
    accept: false
    use: production
    # License ID – obtain from IBM Passport Advantage
    id: L-PDZK-TWDH97
    metric: PROCESSOR_VALUE_UNIT

# -----------------------------------------------------------------------------
# Operator catalog sources (wave 0)
# -----------------------------------------------------------------------------
# Catalog
# -----------------------------------------------------------------------------
# Operator group & subscriptions (wave 1)
# -----------------------------------------------------------------------------
operatorGroup:
  enabled: true   
  name: apiconnect-operator-group

subscriptions:
  enabled: true  
  apiconnect:
    name: ibm-apiconnect
    channel: v7.1
    source: ibm-apiconnect-catalog
    sourceNamespace: openshift-marketplace

  commonServices:
    name: ibm-common-service-operator
    channel: v4.6
    source: opencloud-operators
    sourceNamespace: openshift-marketplace

# -----------------------------------------------------------------------------
# Certificates (wave 2)
# -----------------------------------------------------------------------------
certificates:
  enabled: true

  # Certificate issuer used for ALL certificates (ingress endpoints AND internal mTLS)
  # If name is empty (""), a self-signed CA and namespace-scoped Issuer will be created
  # If name is provided, it must reference an existing Issuer or ClusterIssuer
  #
  # Important: IBM API Connect requires all certificates to be signed by the same CA
  # for proper trust validation between subsystems.
  #
  # Examples:
  #   Self-signed (default):
  #     name: ""
  #     kind: Issuer
  #
  #   External enterprise CA:
  #     name: "enterprise-issuer"
  #     kind: Issuer  (or ClusterIssuer)
  #     caSecretName: "enterprise-ca"
  issuer:
    name: ""
    kind: Issuer
    # defaults to "ingress-ca" for self-signed
    caSecretName: ""

# -----------------------------------------------------------------------------
# Management subsystem (wave 3)
# -----------------------------------------------------------------------------
management:
  enabled: true
  profile: n1xc2.m16
  storageClass: ""   # leave empty to inherit global.storageClass
  # Cloud Manager admin password secret, read by the operator by naming
  # convention (not referenced in ManagementCluster spec). Auto-generated by
  # this chart in wave 2 unless autoGenerate: false. Change the password on
  # first login regardless.
  adminSecret:
    name: management-admin-secret
    key: password
    autoGenerate: true

# -----------------------------------------------------------------------------
# Analytics subsystem (wave 3)
# -----------------------------------------------------------------------------
analytics:
  enabled: true
  profile: n1xc2.m16
  storageClass: ""   # leave empty to inherit global.storageClass
  storageType: shared
  dataVolumeSize: 100Gi
  platformCASecret: ""  # leave empty to use certificates.caSecretName
  # Enable additional analytics modes
  federatedAPIManagementMode: true
  devPortalMode: true

# -----------------------------------------------------------------------------
# Developer Portal subsystem (wave 3)
# -----------------------------------------------------------------------------
devportal:
  enabled: true
  profile: n1xc2.m4
  # Reference to the analytics subsystem
  analyticsRef:
    name: analytics
    namespace: ""   # leave empty to use global.namespace

# -----------------------------------------------------------------------------
# webMethods API Gateway subsystem (wave 3)
# -----------------------------------------------------------------------------
wmapigateway:
  enabled: true
  profile: n1xc3.m6
  imageRegistry: ""   # leave empty to inherit global.imageRegistry
  storageClass: ""    # leave empty to inherit global.storageClass
  dataVolumeSize: 10Gi
  # Encryption secret (optional – set enabled: true to activate).
  # Auto-generated by this chart in wave 2 unless autoGenerate: false.
  encryptionSecret:
    enabled: false
    secretName: wmapigateway-enc-key
    autoGenerate: true
  # Admin password secret. Not managed by this chart at all — the
  # ibm-apiconnect operator creates and owns it itself when the
  # WMAPIGatewayCluster CR (wave 3) is submitted (see README "Subsystem
  # secrets" for why Helm doesn't touch it).
  adminSecret:
    name: wmapigateway-admin-secret
    key: password

# -----------------------------------------------------------------------------
# Valkey key-value store (waves 1/2/3) – required by the Nano Gateway subsystem
# -----------------------------------------------------------------------------
# When enabled, this chart deploys the IBM Valkey operator (wave 1), TLS
# certificates for Valkey (wave 2) and a ValkeyCluster CR (wave 3) alongside
# the rest of the API Connect stack. If nanogateway.redis.host is left empty,
# it is automatically wired to point to this in-chart ValkeyCluster.
valkey:
  enabled: false

  # Valkey operator image
  operatorImage: cp.icr.io/cp/datapower/valkey-operator:1.0.0@sha256:a2c97f301189aabc8a1dbaff2357d794af747305fea8e5d36e62ee4c9d8f058b
  operatorResources:
    limits:
      cpu: 500m
      memory: 500Mi
    requests:
      cpu: 500m
      memory: 500Mi

  # ValkeyCluster image
  image: cp.icr.io/cp/datapower/valkey:8.1.4@sha256:228954da8acaa22736279c477c4e5780284e306431eb2bf7bbb61710cfc5ec47

  # Number of leader shards, and replicas per leader/follower
  clusterSize: 3
  leaderReplicas: 3
  followerReplicas: 3
  clusterVersion: v7

  # Enable persistent storage for data
  persistenceEnabled: false

  # Storage for the node config volume (always created)
  nodeConfStorageSize: 1Gi
  storageClass: ""   # leave empty to inherit global.storageClass

  # Secret holding the Valkey password. Auto-generated by this chart if it
  # does not already exist (see credentialSecret.autoGenerate).
  # The Nano Gateway management component reads both a username and a
  # password from this secret (mounted as files at /opt/ibm/dpn/creds/db),
  # so both keys must be present even though the ValkeyCluster CR only
  # references credentialSecret.key (password).
  credentialSecret:
    name: valkey-secret
    key: password
    usernameKey: username
    username: default
    autoGenerate: true

  # Name of the TLS secret created by cert-manager for Valkey
  tlsSecret: valkey-tls

# -----------------------------------------------------------------------------
# Nano Gateway subsystem (wave 1: operator, wave 3: NanoGatewayCluster CR)
# -----------------------------------------------------------------------------
# The Nano Gateway CRDs (nano.datapower.ibm.com) ship in this chart's crds/
# folder and are installed once by Helm; they are NOT updated on `helm
# upgrade` (standard Helm CRD behavior) so re-apply crds/nanogateway-crds.yaml
# manually when upgrading to a Nano Gateway operator version with new CRDs.
#
# Gateway API reached GA in OpenShift 4.19, which ships its CRDs
# (gatewayclasses.gateway.networking.k8s.io, etc.) by default. On older
# clusters (< 4.19, Gateway API only in Developer Preview) install the
# cluster-wide Gateway API CRDs manually before deploying this subsystem:
#   oc apply -f https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.2.1/standard-install.yaml
#
# This chart verifies the Gateway API is present in the target cluster before
# deploying the Nano Gateway operator (wave 1) and fails with instructions if
# it is missing. Set nanogateway.skipGatewayApiCheck: true to bypass this
# check (required when rendering with `helm template` / `--dry-run=client`,
# which cannot see the cluster's installed APIs).
nanogateway:
  enabled: false
  profile: n1xc2.m4
  # Note: the gateway-proxy/ingw images live under cp/apic on cp.icr.io (same
  # repo as the ibm-apiconnect operator's relatedImages), NOT cp/datapower.
  imageRegistry: cp.icr.io/cp/apic
  skipGatewayApiCheck: false

  # Dedicated Nano Gateway operator (distinct from the ibm-apiconnect operator)
  # Deployed into global.namespace, same as the rest of this chart.
  # To find the exact image digest for another channel (the "8.0.0" below is
  # the channel number, not the product version), see images-all.txt in the
  # matching IBM CASE package, e.g.:
  # https://github.com/IBM/cloud-pak/blob/master/repo/case/ibm-apiconnect/8.0.0/OLM/images-all.txt
  operatorImage: cp.icr.io/cp/datapower/datapower-nano-operator@sha256:a09a2c497fa96347dc667c513818e1e60110f6e4ebd2b08aff5cef74be16e0b3
  operatorResources:
    limits:
      cpu: 2
      memory: 2Gi
    requests:
      cpu: 500m
      memory: 512Mi

  redis:
    host: ""          # leave empty to use the in-chart Valkey (requires valkey.enabled: true)
    port: 6379
    mode: cluster
    credentialSecret: valkey-secret
    tlsSecret: valkey-tls

# -----------------------------------------------------------------------------
# Federated API Management subsystem (wave 3)
# -----------------------------------------------------------------------------
federatedapimanagement:
  enabled: true
  profile: n1xc3.m4
  analyticsRef:
    name: analytics
    namespace: ""   # leave empty to use global.namespace
  # Control-plane account FAM uses to authenticate the Management subsystem
  # (set via the apic_fam_config post-config role, wave 4). Auto-generated by
  # this chart in wave 2 unless autoGenerate: false.
  adminSecret:
    name: fam-admin-secret
    key: password
    username: administrator
    autoGenerate: true

# -----------------------------------------------------------------------------
# Post-configuration (wave 4) – automates the manual steps described in
# APICv12InstallGuide.md (mail server, provider org, gateway/portal topology,
# Federated API Management). Runs a Job executing the Ansible playbook
# shipped in ansible/ (packaged into a ConfigMap, see
# templates/postconfig-configmaps.yaml).
#
# Requires the mailpit namespace/deployment to already exist, and each
# targeted subsystem (nanogateway, wmapigateway, devportal, ...) to be
# enabled and Ready before this wave runs.
#
# The image is NOT built by this chart: build ansible/Dockerfile yourself and
# push it to your (mirrored, if air-gapped) registry first — see
# ansible/Dockerfile for build instructions.
postConfig:
  enabled: false
  image: ""   # REQUIRED if enabled – e.g. your-registry/iwhi/apic-postconfig:1.0.0
  # Only needed if the image above lives in an external registry that
  # requires auth (e.g. cp.icr.io). Leave empty for an image pushed to this
  # namespace's internal OpenShift ImageStream.
  imagePullSecret: ""
  # Namespace where MailPit is deployed (see README "Prerequisites"). The
  # apic_initial_config role checks it's Ready before connecting Cloud
  # Manager to it; this chart grants apic-postconfig read access there.
  mailpitNamespace: mailpit
  backoffLimit: 2
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi

  # Only apic_porg_gateways / apic_porg_portal / apic_config_info roles;
  # leave empty to run the full site.yml in order.
  tags: []

  # Demo Provider Org, created if absent (role apic_porg_lur). `admin` is the
  # user created in the api-manager-lur registry and set as this org's owner
  # (owner_url) — not an existing user, this chart creates it for you.
  providerOrg:
    name: user-demo-org
    title: "USER Demo Provider Org"
    admin:
      username: ""  # REQUIRED if enabled – login id, e.g. "jdupont"
      email: ""     # REQUIRED if enabled
      firstName: "" # REQUIRED if enabled
      lastName: ""  # REQUIRED if enabled

  # Mail server definition registered in Cloud Manager (role
  # apic_initial_config), connected to Cloud Manager BEFORE the provider org
  # is created. No default: you must explicitly point this at a real SMTP
  # server (e.g. the MailPit instance from the README "Prerequisites") —
  # there is no safe default host to silently fall back to.
  #
  # NOTE: authenticated SMTP (username/password) is not yet supported here —
  # the API Connect mail-server "credentials" schema for username/password
  # auth hasn't been confirmed against IBM's official documentation. MailPit
  # and any other server that accepts unauthenticated SMTP work today; if you
  # need authenticated SMTP, open an issue or confirm the schema and extend
  # roles/apic_initial_config accordingly.
  mailServer:
    name: ""   # REQUIRED if enabled – e.g. mailpit-server
    title: ""  # REQUIRED if enabled – e.g. Mail Pit Server
    host: ""   # REQUIRED if enabled – e.g. mailpit-smtp.mailpit.svc.cluster.local
    port: 0    # REQUIRED if enabled – e.g. 1025
    # Enable TLS/STARTTLS when talking to the SMTP server.
    secure: false
    # "From" address used by API Connect for outgoing mail.
    senderName: "APIC Administrator"
    senderAddress: "admin@apiconnect.net"
    # Generated API key lifetime/reuse policy (cloud settings), unrelated to
    # the mail server itself but configured in the same API call.
    apiKeyExpiresIn: 300
    apiKeyMultipleUses: true


